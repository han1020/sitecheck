# 정기점검 baseline
#
# 스크래핑으로 신규(일반)점검을 감지하지 못해도, 아래 항목은 엑셀에 항상 포함됩니다.
# 기관에 정기점검 일정이 추가/변경되면 이 파일을 수정하거나
# 웹 대시보드 '정기점검' 탭에서 직접 편집하세요. (다음 수집부터 반영)

regular:
