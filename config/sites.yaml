# 점검 공지 수집 대상 사이트 목록
#
# 각 사이트는 다음 필드를 가집니다:
#   code:                    내부 식별자 (스크린샷 폴더명에도 사용) - 참조 엑셀의 ModuleCode 동일
#   name:                    사이트명 (엑셀 표시) - 참조 엑셀의 ModuleName
#   category:                분류 (은행/저축은행/카드/증권/공공/etc)
#   enabled:                 true 면 스크래핑 수행. false 면 메타만 보유 (정기점검은 출력)
#   list_url:                공지사항 목록 페이지 URL
#   list_item_selector:      목록의 각 행을 가리키는 CSS 셀렉터
#   title_selector:          행 안에서 제목 텍스트를 잡는 셀렉터 (a 태그 권장)
#   date_selector:           행 안에서 작성일을 잡는 셀렉터 (있을 경우)
#   detail_url_attr:         'href' 또는 'click' (JS로 열리는 경우)
#   detail_content_selector: 상세 페이지 본문 영역 (점검 일시 파싱용)
#   wait_selector:           목록 페이지가 로드 완료됐다고 판단할 셀렉터
#   max_items:               목록에서 검사할 최대 행 수 (기본 20)
#
# 신규 사이트를 활성화하려면 enabled: true 로 바꾸고 셀렉터를 채우면 됩니다.

