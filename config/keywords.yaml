# 점검 공지 판별 키워드
# 공지 제목에 아래 단어 중 하나라도 포함되면 "점검 공지"로 간주합니다.
# 필요에 따라 자유롭게 추가/제거하세요.

include:
  - 점검
  - 서비스 일시중단
  - 서비스 일시 중단
  - 서비스 중단
  - 업무 일시중단    # 예: iM증권 '인프라 고도화에 의한 업무 일시중단 안내'
  - 업무일시중단
  - 업무 일시 중단
  - 업무 중단
  - 업무중단
  - 일시중지
  - 일시 중지
  - 시스템 작업
  - 시스템작업
  - 업그레이드
  - 정기점검
  - 임시점검
  - 긴급점검
  - 서비스 변경
  - 거래중단
  - 거래 중단
  - 이용제한
  - maintenance
  - 메인터넌스

# 점검 같지만 실제로는 점검이 아닌 공지를 제외 (제목 기준)
# 예: '점검 결과 안내', '예방 캠페인' 같은 안내성 공지
# 또는 KB가 다른 기관(저축은행, 외환은행 등)의 점검을 대신 안내하는 경우
exclude:
  - 점검 결과
  - 점검결과
  - 정상화 안내
  - 캠페인
  - 모니터링 기준
  - 입찰            # 입찰공고(업그레이드'사업' 등) — 점검 아님. 예: 전북은행 방화벽/DDoS 입찰
  - 입찰공고
  # 외부 기관 점검 안내성 공지 (자기 점검이 아님 → 모니터링 대상 X)
  - 일부기관
  - 일부 기관
  - 타기관
  - 타 기관
  - 외부기관
  - 외부 기관
  - 관련 기관
  - 타사
  - 타행
  - 타금융기관
  - 타 금융기관
  - 타금융
  - 타 금융
  # 모니터링 대상 외 (사용자 요청)
  - 오픈뱅킹
  - 재해복구훈련
  - 재해복구 훈련
  - 카카오톡 채팅 상담  # 카톡 채팅 상담만 중단되는 공지 — 예: 신한저축은행 '대외계 시스템 작업'(업무 라벨에만 등장)
  - 카카오톡 상담      # ※ 전면 점검의 업무 목록에 들면 그 공지가 통째로 빠질 수 있으나, 상담 채널이라 핵심 업무와 병기될 가능성 낮음
  # 제휴/외부 결제·자산 서비스 (자기 기관 점검 아님)
  - 제로페이
  - my자산
  - 마이자산
  - 마이데이터        # 마이데이터(외부/제휴) — 예: KB증권 마이데이터 시스템 작업
  - 디지털금융망
  - 디지털 금융망
  - 아이부자
  - 하나머니          # 하나금융 포인트 서비스 — 예: 하나증권
  - NH멤버스          # NH농협 계열 포인트 서비스(NH포인트) — 예: 농협은행 '비대면 정기적금 가입 전 유의사항'
  # 외부 시스템(금융결제원 등) 의존 서비스 — 자기 점검 아님
  - 금융인증서        # 금융결제원 금융인증서비스 — 예: 신한저축은행
  - 신한인증서        # 신한인증서 서비스 — 모니터링 대상 외 (사용자 요청)
  - SC제일은행        # 타행(SC제일) 계좌통합관리서비스 안내 — 예: 전북은행
  # 외부 스크래핑/데이터 제공사(쿠콘 등) 서비스 중단 — 자기 점검 아님
  - 쿠콘              # 쿠콘(Coocon) 전산센터/선불정보 서비스 — 예: 경남은행, 신한저축은행
  - 스크래핑          # 스크래핑 서비스 일시중단(외부 제공사 의존)
  # 규제/외부 시스템 서비스 — 자기 점검 아님
  - 전기통신금융사기   # 통신사기피해환급법 피해구제·이의제기 서비스 — 예: SC은행
  - 서울보증보험      # SGI서울보증보험 시스템 작업(사잇돌대출) 안내 — 예: 신한저축은행
  - 계좌통합          # 금융결제원 계좌통합관리서비스(어카운트인포) — 예: 전북은행 '일부 참가기관 계좌통합관리서비스'
  - 스탁론            # 연계신용대출(스탁론) 관련 업무 — 예: 하나증권 RMS 점검(업무 라벨에만 등장)
  # 외부 기관(경찰청/행정안전부) 신원확인 서비스 — 자기 점검 아님
  - 운전면허증        # 운전면허증 진위확인·본인확인 서비스(경찰청/도로교통공단) — 다수 은행/증권 동시 안내
  - 신분증            # 모바일 신분증·신분증 진위확인 서비스(행정안전부 등) — 다수 기관 동시 안내
  - 주민등록증        # 주민등록증 진위확인 서비스(행정안전부) — 자기 점검 아님 — 다수 기관 동시 안내
  - 국가보훈등록증    # 모바일 국가보훈등록증 발급·제출 서비스(국가보훈부) — 자기 점검 아님 — 예: 부산은행
  - 휴대폰 본인확인   # 통신사(SKT 등) 휴대폰 본인확인 서비스 작업 — 자기 점검 아님 — 예: 미래에셋증권
  # 모니터링 대상 외 (사용자 요청)
  - 자동주문서비스    # 자동주문서비스 시스템 점검 — 예: 신한투자증권
  - 우리WON MTS     # MTS 채널만 중단되는 부분 서비스 공지 — 예: 우리투자증권(업무 라벨에 등장)
                    # ※ 'MTS'만 넣으면 한국투자증권 '온라인 전채널(MTS HTS …)' 전면중단 공지까지 빠진다
  - 펀드 예약신규     # 비대면 펀드 예약신규 서비스 중단 — 예: 수협은행
  - 콜봇              # 콜봇 서비스 일시 중단 — 예: KB증권
  - 주식옵션위클리    # 주식옵션 위클리상품 오픈에 따른 점검(상품 오픈 안내) — 예: NH투자증권(사유 라벨에 등장)
  - 정부24            # 정부24(행정안전부) 성능점검 의존 서비스 — 자기 점검 아님 — 예: 제주은행/애큐온저축은행
  - 자동차 시세       # 자동차 시세 조회 서비스 — 공공기관(정부24/자동차365) 데이터 전환 의존, 자기 점검 아님 — 예: KB증권
  - 우편서비스        # 우편 발송 관련 서비스 — 모니터링 대상 외 (사용자 요청)
  - 우편 서비스

# '제목'에서만 매칭하는 제외 키워드.
# 업무·사유 라벨 '값'에 정상적으로 등장할 수 있는 단어는 exclude 가 아니라 여기에 둔다.
# (exclude 는 제목 + 사유·업무 라벨을 모두 검사하므로, 그런 단어를 넣으면
#  해당 단어가 영향 업무 목록에 든 점검 공지가 통째로 제외된다.)
exclude_title:
  - CD공동망          # 'CD공동망 일시중단' 제목 공지만 제외 — 예: 산업은행
                     # ※ exclude 에 두면 광주은행 업무 값 '전자금융공동망, CD공동망 …'에 걸려
                     #    광주은행 점검 공지가 통째로 빠진다
  - 챗봇              # 챗봇 서비스만 중단되는 공지 제외 — 예: 신한투자증권 '챗봇시스템 점검 안내'
                     # ※ 전면 점검의 업무 목록에 '챗봇'이 들 수 있어 exclude 가 아닌 제목 매칭만
  - PASS 인증         # PASS(통신사 패스) 인증 서비스만 중단되는 공지 제외 — 예: 우체국 'PASS 인증관련 시스템 작업 안내'
  - PASS인증          # ※ 전면 점검의 업무 목록에 'PASS 인증'이 들 수 있어 exclude 가 아닌 제목 매칭만

# 제목/라벨이 아닌 '본문 전체'에서 매칭하는 제외 키워드.
# 오탐(전체 점검을 잘못 제외) 위험이 크므로 충분히 특이한 문구만 둘 것.
exclude_body:
  - 투자정보 콘텐츠    # 검색·콘텐츠만 일시정지하는 공지 — 예: 미래에셋증권 월간 시스템 점검(본문에만 등장)
  - 쿠콘              # 쿠콘(대외기관) 작업으로 인한 중단 — 제목·라벨엔 안 나오고 본문에만 등장하는 케이스
                     # 예: KB저축은행 '전자금융서비스 일시 중단'(본문: 쿠콘 전산센터 방화벽 교체)

# 외부기관 작업 안내 자동 감지(external_subject).
# 제목에 자기 기관명이 없고 아래 명부의 기관명이 있으면 '남의 점검' 안내로 보고 제외한다.
# 명부 = sites.yaml 의 기관명 73개 + 아래 두 목록. 3글자 미만 이름은 오탐 탓에 무시된다.

# sites.yaml 에 없는 외부 조직/사업자
external_orgs:
  - 대법원
  - 금융결제원
  - 코스콤
  - 행정안전부
  - 경찰청
  - 도로교통공단
  - 한국거래소
  - 예탁결제원
  - 신용정보원
  - 뱅크오브아메리카
  - LG유플러스
  - SKT
  - 삼성패스          # 삼성전자 인증 서비스 — 예: DB저축은행 '삼성패스 간편인증 서비스 일시 중단'

# sites.yaml 의 표기와 다르게 쓰이는 기관명 변형
institution_aliases:
  - 케이뱅크          # sites.yaml 은 'K뱅크'
  - NH농협카드        # sites.yaml 은 'NH카드' — 계열 카드사(농협은행 자기 점검 아님)
  - 농협카드
  - 한국씨티은행
  - 한국산업은행
  - KB국민은행
  - NH농협은행
  - IBK기업은행
  - 하나은행
